<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Me | 183595 Baylasan Mueen Al Obeidat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html">Baylasan Al Obeidat</a>
      <nav aria-label="Main menu">
        <ul class="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="contact.html" aria-current="page">Contact Me</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section>
      <h1>Contact me</h1>
      <p class="lead" style="color: var(--muted)">Have a question or a project idea? Fill in the form and I will get back to you.</p>

      <div class="form-card">
        <form id="contactForm" novalidate>
          <div class="field">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" autocomplete="name">
          </div>

          <div class="field">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email">
          </div>

          <div class="field">
            <label for="country">Country</label>
            <select id="country" name="country">
              <option value="">Select your country</option>
              <option>Jordan</option>
              <option>Saudi Arabia</option>
              <option>United Arab Emirates</option>
              <option>Palestine</option>
              <option>Egypt</option>
              <option>Iraq</option>
              <option>Syria</option>
              <option>Lebanon</option>
              <option>Kuwait</option>
              <option>Qatar</option>
              <option>Bahrain</option>
              <option>Oman</option>
              <option>Yemen</option>
              <option>Morocco</option>
              <option>Algeria</option>
              <option>Tunisia</option>
              <option>Libya</option>
              <option>Sudan</option>
              <option>Turkey</option>
              <option>United States</option>
              <option>United Kingdom</option>
              <option>Canada</option>
              <option>Germany</option>
              <option>France</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field">
            <label for="comments">Comments</label>
            <textarea id="comments" name="comments"></textarea>
          </div>

          <p class="error" id="formError" role="alert"></p>
          <button type="submit" class="btn">Submit</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>Baylasan Mueen Al Obeidat (183595) &middot; <a href="mailto:bmalobaidat24@cit.just.edu.jo">bmalobaidat24@cit.just.edu.jo</a></p>
    </div>
  </footer>

  <script>
    var form = document.getElementById("contactForm");
    var errorBox = document.getElementById("formError");
    var fields = [
      { el: document.getElementById("fullName"), name: "Full name" },
      { el: document.getElementById("email"), name: "Email address" },
      { el: document.getElementById("country"), name: "Country" },
      { el: document.getElementById("comments"), name: "Comments" }
    ];

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      var missing = [];

      fields.forEach(function (f) {
        var empty = f.el.value.trim() === "";
        f.el.classList.toggle("invalid", empty);
        if (empty) missing.push(f.name);
      });

      if (missing.length > 0) {
        errorBox.textContent = "Please fill in: " + missing.join(", ") + ".";
        return;
      }

      var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(fields[1].el.value.trim())) {
        fields[1].el.classList.add("invalid");
        errorBox.textContent = "Please enter a valid email address.";
        return;
      }

      errorBox.textContent = "";
      alert("Thank you! Your form was submitted successfully.");
      form.reset();
    });
  </script>

</body>
</html>
